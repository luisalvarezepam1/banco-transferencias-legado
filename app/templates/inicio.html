{% extends "base.html" %}
{% block contenido %}
<h1>Clientes y cuentas</h1>
<div class="tarjetas">
{% for c in clientes %}
  <section class="tarjeta">
    <h2>{{ c.nombre }}</h2>
    <p class="dim">{{ c.id }} · {{ c.segmento }}</p>
    <table>
      <thead><tr><th>Cuenta</th><th>Tipo</th><th class="num">Saldo</th><th>Estado</th></tr></thead>
      <tbody>
      {% for a in c.cuentas %}
        <tr><td><a href="{{ url_for('web.cuenta', numero=a.numero) }}">{{ a.numero }}</a></td><td>{{ a.tipo }}</td>
            <td class="num">{{ a.moneda }} {{ a.saldo }}</td><td>{{ a.estado }}</td></tr>
      {% endfor %}
      </tbody>
    </table>
  </section>
{% endfor %}
</div>
{% endblock %}
