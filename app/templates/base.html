<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Transferencias Inmediatas{% endblock %} · Banco ficticio</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='estilo.css') }}">
</head>
<body>
  <header class="barra">
    <div class="barra__in">
      <a class="marca" href="{{ url_for('web.inicio') }}">Transferencias Inmediatas <small>v1.4 · legado</small></a>
      <nav>
        <a href="{{ url_for('web.inicio') }}" class="{{ 'activo' if request.endpoint in ('web.inicio', 'web.cuenta') }}">Cuentas</a>
        <a href="{{ url_for('web.transferir') }}" class="{{ 'activo' if request.endpoint == 'web.transferir' }}">Transferir</a>
        <a href="/api/salud">API</a>
      </nav>
    </div>
  </header>
  <div class="aviso"><p>Banco ficticio para el workshop de IA agéntica. Todos los datos son inventados.</p></div>
  <main>{% block contenido %}{% endblock %}</main>
</body>
</html>
