name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # OIDC hacia Azure: sin secretos guardados

concurrency:
  group: deploy-legado
  cancel-in-progress: false

env:
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  desplegar:
    needs: pruebas
    runs-on: ubuntu-latest
    environment:
      name: azure
      url: ${{ steps.infra.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Infraestructura (Terraform)
        id: infra
        working-directory: infra
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RG }}" \
            -backend-config="storage_account_name=${{ vars.TF_STATE_SA }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=banco-transferencias-legado.tfstate" \
            -backend-config="use_oidc=true" \
            -backend-config="use_azuread_auth=true"
          terraform apply -input=false -auto-approve
          echo "app=$(terraform output -raw app_name)" >> "$GITHUB_OUTPUT"
          echo "url=$(terraform output -raw url)" >> "$GITHUB_OUTPUT"

      - name: Paquete
        run: zip -qr app.zip app wsgi.py requirements.txt

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ steps.infra.outputs.app }}
          package: app.zip

      - name: Prueba de humo
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "${{ steps.infra.outputs.url }}/api/salud"; then echo; exit 0; fi
            sleep 10
          done
          echo "La app no respondió" && exit 1
